name: paper-trading
on:
  schedule:
    - cron: '*/30 3-18 * * 1-5'
    - cron: '30 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas tzdata
      - run: python mcx_bundle.py
      - run: python run_scheduled.py
      - run: python paper_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "paper update" -q
          git pull --rebase -q
          git push -q